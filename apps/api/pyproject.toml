[project]
name = "tri-mesure"
version = "0.1.0"
description = "Tri & Mesure — human-reviewed AI triage of claim e-mails, with measurement"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "anthropic>=0.75",
    "openai>=1.55",
    "httpx>=0.27",
    "faker>=30.0",
    "pyjwt>=2.9",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-bdd>=8.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tri_mesure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French text uses typographic characters on purpose

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["tri_mesure"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
"src/tri_mesure/datagen/generate.py" = ["E501"]  # French text templates

# Architecture rules, checked in CI (`uv run lint-imports`). Dependencies point inwards:
#   api -> application -> (llm, pii, audit, db, pipeline) -> domain
[tool.importlinter]
root_package = "tri_mesure"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, no framework, no other layer"
type = "forbidden"
source_modules = ["tri_mesure.domain"]
forbidden_modules = [
    "tri_mesure.api", "tri_mesure.application", "tri_mesure.db", "tri_mesure.llm",
    "tri_mesure.audit", "tri_mesure.pipeline", "tri_mesure.settings",
    "fastapi", "sqlalchemy", "anthropic", "openai", "httpx",
]

[[tool.importlinter.contracts]]
name = "Application layer knows nothing about HTTP"
type = "forbidden"
source_modules = ["tri_mesure.application"]
forbidden_modules = ["tri_mesure.api", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Adapters (LLM, PII, audit chain) do not reach up into use cases or HTTP"
type = "forbidden"
source_modules = ["tri_mesure.llm", "tri_mesure.pii", "tri_mesure.audit"]
forbidden_modules = ["tri_mesure.api", "tri_mesure.application", "fastapi"]

[[tool.importlinter.contracts]]
name = "Only the LLM adapters talk to model vendors"
type = "forbidden"
source_modules = [
    "tri_mesure.api", "tri_mesure.application", "tri_mesure.domain", "tri_mesure.pii",
    "tri_mesure.audit", "tri_mesure.db",
]
forbidden_modules = ["anthropic", "openai"]
allow_indirect_imports = true  # going through tri_mesure.llm is the intended path
